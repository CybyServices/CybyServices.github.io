<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CybyServices</title>
<link rel="icon" href="https://cyby.neocities.org/favicon.png">

<style>
  :root {
    --bg: #2f3136;
    --panel: #36393f;
    --panel-light: #3a3b40;
    --border: #55575e;
    --text: #dcddde;
    --text-dim: #9a9ba0;

    --purple: #a970ff;
    --purple-light: #e0c3ff;

    --discord: #5865F2;
    --discord-light: #7983f5;
  }

  * { box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
  }

  a { color: inherit; text-decoration: none; }

  /* ---------- HEADER ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    background-color: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .logo-link {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-link img {
    height: 40px;
    width: 40px;
    object-fit: contain;
    border-radius: 6px;
    background-color: var(--panel-light);
  }

  .site-title {
    font-size: 22px;
    font-weight: bold;
    background: linear-gradient(90deg, var(--purple), var(--purple-light), var(--purple));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
  }

  @keyframes shine {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  nav {
    display: flex;
    gap: 10px;
    margin-left: 10px;
    flex-wrap: wrap;
  }

  .btn {
    position: relative;
    background-color: var(--panel-light);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }

  .btn:hover { border-color: #7a7c85; }

  /* --- CybyAPI button --- */
  .btn-cybyapi {
    cursor: not-allowed;
    overflow: hidden;
    color: #ffffff;
    text-shadow: 0 0 6px #bfe4ff, 0 0 14px #6ab8ff;
    border-color: #7ec8ff;
    background: linear-gradient(120deg, #0a1930, #16305c, #2f6fc9, #16305c, #0a1930);
    background-size: 300% 300%;
    animation: nightsky 6s ease infinite;
  }

  .btn-cybyapi::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 30%, #fff, transparent),
      radial-gradient(1px 1px at 75% 55%, #fff, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff, transparent),
      radial-gradient(1px 1px at 90% 25%, #fff, transparent),
      radial-gradient(1px 1px at 25% 65%, #fff, transparent),
      radial-gradient(1px 1px at 60% 15%, #fff, transparent);
    opacity: 1;
    animation: twinkle 2s ease-in-out infinite;<!DOCTYPE html>
<html>
<head>
    <title>CybyServices</title>
</head>
<body>
    <h1>CybyServices</h1>
    <p>something</p>
</body>
</html>
  }

  .btn-cybyapi:hover { border-color: #a8dcff; }

  @keyframes nightsky {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes twinkle {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
  }

  .btn-cybyapi .tooltip {
    position: absolute;
    bottom: 120%;
    left: 50%;
    transform: translateX(-50%);
    background: #111214;
    color: #fff;
    padding: 4px 9px;
    border-radius: 4px;
    font-size: 12px;
    white-space: nowrap;
    visibility: hidden;
    opacity: 0;
    transition: opacity .2s;
    z-index: 2;
  }

  .btn-cybyapi:hover .tooltip {
    visibility: visible;
    opacity: 1;
  }

  /* --- Discord button --- */
  .btn-discord {
    background-color: var(--discord);
    border-color: var(--discord-light);
    color: #fff;
  }

  .btn-discord:hover { background-color: var(--discord-light); }

  .badge-new {
    position: absolute;
    top: -8px;
    right: -8px;
    background-color: #ed4245;
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 5px;
    border-radius: 8px;
    letter-spacing: .3px;
  }

  /* ---------- MAIN ---------- */
  main {
    max-width: 800px;
    margin: 30px auto;
    padding: 0 20px;
  }

  .announcement {
    background-color: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .announcement img {
    width: 100%;<!DOCTYPE html>
<html>
<head>
    <title>CybyServices</title>
</head>
<body>
    <h1>CybyServices</h1>
    <p>something</p>
</body>
</html>
    min-height: 150px;
    display: block;
    border-bottom: 1px solid var(--border);
    background-color: var(--panel-light);
    object-fit: cover;
  }

  .announcement-body { padding: 16px; }

  .announcement-title {
    margin: 0 0 4px 0;
    font-size: 20px;
  }

  .announcement-date {
    margin: 0 0 14px 0;
    font-size: 13px;
    color: var(--text-dim);
  }

  /* ---------- VOTES ---------- */
  .votes {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .vote-btn {
    background-color: var(--panel-light);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }

  .vote-btn:hover { border-color: #7a7c85; }
  .vote-btn.voted { opacity: .5; cursor: default; }

  /* ---------- FOOTER ---------- */
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 40px 20px 60px 20px;
  }

  footer p { margin: 6px 0; }
  footer a { color: var(--purple-light); text-decoration: underline; }

  #visit-counter { margin-top: 20px; font-size: 12px; }
</style>
</head>

<body>

<header>
  <a class="logo-link" href="/">
    <img src="https://cyby.neocities.org/CybyAPI/Images/Cyby%20logo%20v1.2.png" alt="Cyby logo">
    <span class="site-title">CybyServices</span>
  </a>

  <nav>
    <a class="btn" href="/">Home</a>
    <a class="btn" href="/Announcements">Announcements</a>
    <a class="btn" href="/CybyRpgbeta">Game (Beta)</a>
    <a class="btn" href="/Fourms">Forums</a>

    <button class="btn btn-cybyapi" type="button">
      CybyAPI
      <span class="tooltip">Coming soon</span>
    </button>

    <a class="btn btn-discord" href="https://discord.gg/ssuwD2z2JJ" target="_blank" rel="noopener" style="position:relative;">
      Discord
      <span class="badge-new">NEW!</span>
    </a>
  </nav>
</header>

<main>

  <section class="announcement">
    <img src="https://cyby.neocities.org/CybyAPI/Images/Cyby%20logo%20v1.2.png" alt="Announcement image">
    <div class="announcement-body">
      <h2 class="announcement-title">Welcome to CybyServices</h2>
      <p class="announcement-date">Posted: July 25, 2026</p>

      <div class="votes"
           data-up-key="cybyservices_post1_upvotes"
           data-down-key="cybyservices_post1_downvotes">
        <button class="vote-btn vote-up" type="button">▲ Upvote (<span class="up-count">0</span>)</button>
        <button class="vote-btn vote-down" type="button">▼ Downvote (<span class="down-count">0</span>)</button>
      </div>
    </div>
  </section>

</main>

<footer>
  <p>More soon. Page in early beta.</p>
  <p>Give feedback <a href="https://www.reddit.com/user/CybyAPI/comments/1v6phww/leave_feedback_on_cybyneocitiesorg_here/" target="_blank" rel="noopener">here</a>.</p>

  <p id="visit-counter">Loading visits…</p>
</footer>

<script>
  const API = "https://countapi.mileshilliard.com/api/v1";

  // ---- Site visit counter ----
  fetch(`${API}/hit/cybyservices_site_visits`)
    .then(r => r.json())
    .then(data => {
      document.getElementById("visit-counter").textContent = `Visits: ${data.value}`;
    })
    .catch(() => {
      document.getElementById("visit-counter").textContent = "Visits: unavailable";
    });

  // ---- Vote counters ----
  document.querySelectorAll(".votes").forEach(block => {
    const upKey = block.dataset.upKey;
    const downKey = block.dataset.downKey;
    const upBtn = block.querySelector(".vote-up");
    const downBtn = block.querySelector(".vote-down");
    const upCount = block.querySelector(".up-count");
    const downCount = block.querySelector(".down-count");
    const storageKey = `voted_${upKey}`;

    fetch(`${API}/get/${upKey}`).then(r => r.json()).then(d => {
      upCount.textContent = d.value ?? 0;
    }).catch(() => {});

    fetch(`${API}/get/${downKey}`).then(r => r.json()).then(d => {
      downCount.textContent = d.value ?? 0;
    }).catch(() => {});

    if (localStorage.getItem(storageKey)) {
      upBtn.classList.add("voted");
      downBtn.classList.add("voted");
      upBtn.disabled = true;
      downBtn.disabled = true;
    }

    upBtn.addEventListener("click", () => {
      if (localStorage.getItem(storageKey)) return;
      fetch(`${API}/hit/${upKey}`).then(r => r.json()).then(d => {
        upCount.textContent = d.value;
        localStorage.setItem(storageKey, "up");
        upBtn.classList.add("voted");
        downBtn.classList.add("voted");
        upBtn.disabled = true;
        downBtn.disabled = true;
      });
    });

    downBtn.addEventListener("click", () => {
      if (localStorage.getItem(storageKey)) return;
      fetch(`${API}/hit/${downKey}`).then(r => r.json()).then(d => {
        downCount.textContent = d.value;
        localStorage.setItem(storageKey, "down");
        upBtn.classList.add("voted");
        downBtn.classList.add("voted");
        upBtn.disabled = true;
        downBtn.disabled = true;
      });
    });<!DOCTYPE html>
<html>
<head>
    <title>CybyServices</title>
</head>
<body>
    <h1>CybyServices</h1>
    <p>something</p>
</body>
</html>
  });
</script>

</body>
</html>
